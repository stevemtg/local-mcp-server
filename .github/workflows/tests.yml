name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline:
    name: Offline tests (Windows, Python 3.13)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline regressions
        run: python -B dev/run_tests.py --offline
      - name: Validate bundled workflow mappings
        run: python -B dev/validate_workflows.py
